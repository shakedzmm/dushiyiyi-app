name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Unpack game www
        run: |
          unzip -q www.zip -d DushiYiYi/Resources
          echo "www files: $(find DushiYiYi/Resources/www -type f | wc -l)"
          test -f DushiYiYi/Resources/www/game.html

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DushiYiYi.xcodeproj \
            -scheme DushiYiYi \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build.log | tail -40

      - name: Ad-hoc sign & pack IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "no .app produced"; exit 1
          fi
          echo "APP: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign -f -s - --deep "Payload/$(basename "$APP")"
          codesign -dv "Payload/$(basename "$APP")" 2>&1 || true
          zip -qry DushiYiYi.ipa Payload
          ls -la DushiYiYi.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DushiYiYi-ipa-${{ github.run_number }}
          path: DushiYiYi.ipa
          retention-days: 90

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DushiYiYi build ${{ github.run_number }}
          body: |
            都市疫医 iOS 云构建。TrollStore 直接安装；普通 iPhone 用自有证书重签（爱思助手/AltStore）。
          files: DushiYiYi.ipa
          fail_on_unmatched_files: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
